[project]
name = "agentic-wiki"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "pylint>=3.3.9",
